name: CD HML

on:
  push:
    branches: [ develop ]

jobs:
  deploy-hml:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - uses: actions/checkout@v4

      # Login Azure
      - name: Login Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_HML }}

      # Login no Azure Container Registry
      - name: Login ACR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Build e push da imagem
      - name: Build e Push para ACR
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/blood-stock-service:hml \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/blood-stock-service:${{ github.sha }} .

          docker push ${{ secrets.ACR_LOGIN_SERVER }}/blood-stock-service:hml
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/blood-stock-service:${{ github.sha }}

      # Configura variáveis do Container App
      - name: Configurar secrets do Container App
        run: |
          az containerapp secret set \
            --name ${{ secrets.AZURE_WEBAPP_NAME_HML }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP_HML }} \
            --secrets \
              database-url="${{ secrets.DATABASE_URL_HML }}" \
              jwt-secret="${{ secrets.JWT_SECRET_HML }}"

      # Deploy
      - name: Deploy Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/blood-stock-service:${{ github.sha }}
          containerAppName: ${{ secrets.AZURE_WEBAPP_NAME_HML }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP_HML }}